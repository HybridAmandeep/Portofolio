[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "https://connectwithamandeep.netlify.app/*"
  to = "https://amandeepkumar.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.amandeepkumar.dev/*"
  to = "https://amandeepkumar.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://amandeepkumar.me/*"
  to = "https://amandeepkumar.dev/:splat"
  status = 301
  force = true
